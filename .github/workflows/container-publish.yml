name: Publish container

on:
  # A v* tag is the release event for the image. Keeping one tag trigger avoids
  # publishing twice when a GitHub Release is created from the same tag.
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "Also move :latest (normally only v* tags do this)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: waypoint-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Gate image publication on CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish linux/amd64 and linux/arm64
    needs: checks
    if: >-
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate OCI metadata and release tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/0x414c49/waypoint
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_latest == true) }}
          labels: |
            org.opencontainers.image.source=https://github.com/0x414c49/Waypoint

      - name: Build and publish multi-platform image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=waypoint
          cache-to: type=gha,mode=max,scope=waypoint
          sbom: true
          provenance: mode=max

      - name: Generate GitHub container attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/0x414c49/waypoint
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

name: Publish container

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize releases so two closely spaced merges cannot calculate the same
  # next version or move :latest out of order.
  group: waypoint-container-main-release
  cancel-in-progress: false

jobs:
  checks:
    name: Gate image publication on CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish linux/amd64 and linux/arm64
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate the release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          current_tag="$(git tag --points-at "$GITHUB_SHA" --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [[ -n "$current_tag" ]]; then
            version="${current_tag#v}"
            existing=true
          else
            latest_tag="$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [[ -z "$latest_tag" ]]; then
              version="0.1.0"
            elif [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              echo "Latest release tag is not valid semantic version: $latest_tag" >&2
              exit 1
            fi
            existing=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "existing=$existing" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Stamp package metadata for the image
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate OCI metadata and release tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/0x414c49/waypoint
          flavor: |
            latest=false
          tags: |
            type=raw,value=main
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/0x414c49/Waypoint
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and publish multi-platform image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=waypoint
          cache-to: type=gha,mode=max,scope=waypoint
          sbom: true
          provenance: mode=max

      - name: Generate GitHub container attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/0x414c49/waypoint
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create release Git tag
        if: steps.version.outputs.existing != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
